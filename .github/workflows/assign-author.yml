name: Assign PR to Author

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  assign-author:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Auto Assign PR
      uses: samspills/assign-pr-to-author@b313feb250ff414d3aff26525b986f080ee7bd7a # v1.0.2
      with:
        repo-token: '${{ secrets.GITHUB_TOKEN }}'
