name: Assign PR to Author

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
    - name: Auto Assign PR
      uses: samspills/assign-pr-to-author@223a87a821f7e7447cfb5221bc53ceeb633341c2 # v1.0.1
      with:
        repo-token: '${{ secrets.GITHUB_TOKEN }}'
