name: Test release body from files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          mkdir -p /tmp/release-notes
          echo "## Changelog" > /tmp/release-notes/CHANGELOG.md
          echo "- Feature A added" >> /tmp/release-notes/CHANGELOG.md
          echo "- Bug B fixed" >> /tmp/release-notes/CHANGELOG.md

      - id: action
        name: Edit release - append file content to body
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          id: "1"
          body: "Release notes:"
          replacebody: "false"
          files: "/tmp/release-notes/CHANGELOG.md"
          spacing: "1"

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / release id not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
