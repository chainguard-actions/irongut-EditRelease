name: Test release body with files content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture file for release body
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          echo "## Changelog" > "$GITHUB_WORKSPACE/tests/fixtures/changelog.md"
          echo "- Feature A added" >> "$GITHUB_WORKSPACE/tests/fixtures/changelog.md"
          echo "- Bug B fixed" >> "$GITHUB_WORKSPACE/tests/fixtures/changelog.md"

      - id: action
        name: Edit release body with file content
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          id: '1'
          body: 'Release notes:'
          replacebody: 'true'
          files: 'tests/fixtures/changelog.md'
          spacing: '2'

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
